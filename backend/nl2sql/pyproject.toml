[project]
name = "customer-support-nl2sql"
version = "0.1.0"
description = "NL2SQL microservice for customer support data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "langchain==0.3.1",
    "langchain-openai==0.2.1",
    "langchain-community==0.3.1",
    "langchain-core==0.3.6",
    "openai==1.50.2",
    "tiktoken==0.7.0",
    "pgvector==0.3.2",
    "apscheduler==3.10.4",
    "httpx==0.27.2",
    "requests==2.32.3",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "json5==0.9.28",
    "json-repair==0.28.2",
    "cryptography==43.0.1",
    "python-multipart==0.0.12",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "structlog==24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
